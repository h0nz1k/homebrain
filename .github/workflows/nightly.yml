name: Nightly HA compatibility

# Weekly instead of daily: the same suites run locally (suite.sh) and in CI on every relevant change;
# ha-compose-e2e is still a placeholder. Manual run via workflow_dispatch.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ha-compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ha_version: [stable, beta]
    steps:
      - name: HA compose e2e placeholder
        env:
          HA_VERSION: ${{ matrix.ha_version }}
        run: |
          echo "TODO (#8): run ha-test compose e2e against Home Assistant $HA_VERSION after onboarding seed is implemented."

  python-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pip install -U pytest-homeassistant-custom-component
      - run: pytest tests/python
