name: Nightly HA compatibility

# Weekly instead of daily: PR CI covers every relevant change (docs/ci.md). This workflow runs what
# PR CI deliberately skips: full-history secret scan, the whole e2e suite incl. the tablet project,
# latest HA test deps and the real-HA compatibility matrix (ha-compat). Manual run via workflow_dispatch.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      scope:
        description: 'all = whole weekly suite; ha-compat = only the real-HA matrix'
        type: choice
        options: [all, ha-compat]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Real Home Assistant in Docker (issue #26): minimum version from hacs.json, stable and beta.
  # Seeds a throwaway instance (onboarding user, demo + template entities, HomeBrain config entry
  # with demo bindings), checks load/panels/WS/system_log and runs the tests/e2e-ha smoke.
  ha-compat:
    name: ha-compat (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write # beta failure → open/update the tracking issue
    strategy:
      fail-fast: false
      matrix:
        ha: [minimum, stable, beta]
    env:
      HB_HA_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: version
        name: Resolve HA image tag
        env:
          HA: ${{ matrix.ha }}
        run: |
          if [ "$HA" = minimum ]; then tag=$(jq -r .homeassistant hacs.json); else tag="$HA"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "HA_VERSION=$tag" >> "$GITHUB_ENV"
      - name: Pull HA image (in background while building)
        run: docker compose -f ha-test/docker-compose.yml pull --quiet &
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@homebrain/panel...' build && pnpm build:integration
      - name: Start Home Assistant ${{ steps.version.outputs.tag }}
        run: docker compose -f ha-test/docker-compose.yml up -d --wait --wait-timeout 300
      - name: Onboarding seed (user, HomeBrain config entry, demo bindings)
        run: node ha-test/onboard.mjs
      - name: Compatibility checks (load, panels, WS API, system_log)
        run: node ha-test/compat-check.mjs
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Playwright smoke against real HA (desktop)
        run: pnpm test:e2e:ha
      - name: system_log after e2e
        env:
          HB_COMPAT_LOGS_ONLY: '1'
        run: node ha-test/compat-check.mjs
      - name: HA log
        if: always()
        run: docker compose -f ha-test/docker-compose.yml logs --no-color > ha-${{ matrix.ha }}.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ha-compat-${{ matrix.ha }}
          path: |
            ha-${{ matrix.ha }}.log
            playwright-report-ha/
          retention-days: 7
      - name: Open/update issue on beta failure
        if: failure() && matrix.ha == 'beta' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="HA beta: HomeBrain compatibility check fails"
          beta=$(docker compose -f ha-test/docker-compose.yml exec -T homeassistant python -c 'from homeassistant.const import __version__; print(__version__)' 2>/dev/null || echo beta)
          body="Weekly HA compatibility run failed against Home Assistant \`$beta\` (ref \`$GITHUB_REF_NAME\`, $GITHUB_SHA): $RUN_URL"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - if: always()
        run: docker compose -f ha-test/docker-compose.yml down -v || true

  python-latest:
    if: inputs.scope != 'ha-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pip install -U pytest-homeassistant-custom-component
      - run: pytest tests/python

  # PR/push CI scans only the new commits; the whole history (all refs) is scanned here.
  secrets-full-history:
    if: inputs.scope != 'ha-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: bash scripts/ci/gitleaks.sh

  # PR CI runs only touched specs on desktop + mobile; here: every spec on every project (incl. tablet).
  e2e-full:
    if: inputs.scope != 'ha-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@homebrain/panel...' build
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test --workers="$(nproc)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 7
