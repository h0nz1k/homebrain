name: Nightly HA compatibility

# Weekly instead of daily: PR CI covers every relevant change (docs/ci.md). This workflow runs what
# PR CI deliberately skips: full-history secret scan, the whole e2e suite incl. the tablet project,
# and latest HA test deps. Manual run via workflow_dispatch.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ha-compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ha_version: [stable, beta]
    steps:
      - name: HA compose e2e placeholder
        env:
          HA_VERSION: ${{ matrix.ha_version }}
        run: |
          echo "TODO (#8): run ha-test compose e2e against Home Assistant $HA_VERSION after onboarding seed is implemented."

  python-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: pip install -U pytest-homeassistant-custom-component
      - run: pytest tests/python

  # PR/push CI scans only the new commits; the whole history (all refs) is scanned here.
  secrets-full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: bash scripts/ci/gitleaks.sh

  # PR CI runs only touched specs on desktop + mobile; here: every spec on every project (incl. tablet).
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@homebrain/panel...' build
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test --workers="$(nproc)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 7
