name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions: read # look up the CI result of the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Tests are not repeated when CI already verified exactly this commit on main (docs/ci.md).
      # Anything unclear (no run, still running after 3 min, failed, suite skipped) -> tests run here.
      - name: Was this commit verified by CI?
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/ci-passed.sh
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.ci.outputs.tested != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@homebrain/panel^...' build
      - if: steps.ci.outputs.tested != 'true'
        run: pnpm lint
      - if: steps.ci.outputs.tested != 'true'
        run: pnpm typecheck
      - if: steps.ci.outputs.tested != 'true'
        run: pnpm test
      - if: steps.ci.outputs.tested != 'true'
        run: pip install -r requirements-test.txt
      - if: steps.ci.outputs.tested != 'true'
        run: pytest tests/python
      - run: pnpm build
      - run: pnpm build:integration
      - run: node scripts/check-bundle-size.mjs
      - run: bash scripts/package-release.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--title "HomeBrain ${TAG}" --generate-notes --verify-tag)
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" dist-release/homebrain.zip dist-release/homebrain.zip.sha256 "${flags[@]}"
