name: CI

# Minute budget rules (gate, reuse on merge, scoped e2e): docs/ci.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR runs are superseded by new pushes; main runs are cheap (mostly reused) and must not be lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Always runs (also drafts and docs-only changes): gate + gitleaks, then lint/typecheck/unit/build when needed.
  # The gate used to be a separate `secrets` job; folding it in saves one billed minute per run.
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read # reuse check reads the PR's CI run + log
      pull-requests: read # commit -> merged PR lookup
    outputs:
      python: ${{ steps.gate.outputs.python }}
      e2e: ${{ steps.gate.outputs.e2e }}
      e2e_specs: ${{ steps.gate.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gate (changed paths, reuse of verified PR result)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/gate.sh
      - name: Secret scan (gitleaks, changed commits)
        run: bash scripts/ci/gitleaks.sh "$SCAN_RANGE"
        env:
          SCAN_RANGE: ${{ steps.gate.outputs.scan_range }}
          GH_TOKEN: ${{ github.token }}
      - name: Reuse verified PR result
        if: steps.gate.outputs.reused == 'true'
        run: echo "Identical tree on identical base already passed CI on the PR; suite skipped."

      - if: steps.gate.outputs.js == 'true'
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - if: steps.gate.outputs.js == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.js == 'true'
        run: pnpm install --frozen-lockfile
      # Workspace exports point at dist; prepare them on a clean checkout.
      - if: steps.gate.outputs.js == 'true'
        run: pnpm --filter '@homebrain/panel^...' build
      - if: steps.gate.outputs.js == 'true'
        run: pnpm lint
      - if: steps.gate.outputs.js == 'true'
        run: pnpm typecheck
      - name: Unit tests (vitest)
        if: steps.gate.outputs.js == 'true'
        run: pnpm test
      - if: steps.gate.outputs.js == 'true'
        run: pnpm build
      # Živý katalog komponent (dev nástroj) musí jít sestavit; do bundlu panelu nepatří.
      - if: steps.gate.outputs.js == 'true'
        run: pnpm --filter @homebrain/panel build:catalog
      - if: steps.gate.outputs.js == 'true'
        run: pnpm build:integration
      - if: steps.gate.outputs.js == 'true'
        run: node scripts/check-bundle-size.mjs
      - if: steps.gate.outputs.js == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-dist
          path: apps/panel/dist/
          if-no-files-found: error

  python:
    needs: js
    if: ${{ !cancelled() && needs.js.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      # uv installs the large HA test stack several times faster than pip (job fits one billed minute).
      - run: |
          python -m pip install --disable-pip-version-check uv==0.13.7
          uv pip install --system -r requirements-test.txt
      - run: ruff check .
      - name: Private HA API guard (#27)
        run: python scripts/ci/check_private_ha_api.py
      - run: ruff format --check .
      - name: Python tests (pytest)
        run: pytest tests/python

  e2e:
    needs: js
    if: ${{ !cancelled() && needs.js.result == 'success' && needs.js.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Panel itself too: waste-assets.spec.ts serves the real library bundle from apps/panel/dist.
      - run: pnpm --filter '@homebrain/panel...' build
      - id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # PR/main: desktop + mobile only (tablet runs in nightly.yml); specs scoped by the gate
      # (empty list = whole suite). One worker per vCPU (2 on private, 4 on public runners).
      - name: Playwright (desktop + mobile, scoped)
        env:
          SPECS: ${{ needs.js.outputs.e2e_specs }}
        run: |
          echo "Specs: ${SPECS:-<all>}"
          # shellcheck disable=SC2086 # SPECS is a space-separated list of paths
          pnpm exec playwright test --project=desktop --project=mobile-s21 --workers="$(nproc)" $SPECS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
