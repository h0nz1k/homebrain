name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Heavy jobs run only for relevant path changes (detected in `secrets`) and never on draft PRs.
  # Skipped jobs report as success, so merges are not blocked.
  js:
    needs: secrets
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.secrets.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace exports point at dist; prepare them on a clean checkout.
      - run: pnpm --filter '@homebrain/panel^...' build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Živý katalog komponent (dev nástroj) musí jít sestavit; do bundlu panelu nepatří.
      - run: pnpm --filter @homebrain/panel build:catalog
      - run: pnpm build:integration
      - run: node scripts/check-bundle-size.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-dist
          path: apps/panel/dist/
          if-no-files-found: error

  python:
    needs: secrets
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.secrets.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/python

  e2e:
    needs: [secrets, js]
    if: ${{ !cancelled() && needs.js.result == 'success' && needs.secrets.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Panel itself too: waste-assets.spec.ts serves the real library bundle from apps/panel/dist.
      - run: pnpm --filter '@homebrain/panel...' build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Cheap job that always runs (also on docs-only changes and drafts): gitleaks + path detection.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      js: ${{ steps.changes.outputs.js }}
      python: ${{ steps.changes.outputs.python }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          all_true() { printf 'js=true\npython=true\ne2e=true\n' >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT_NAME" = pull_request ]; then
            # Checkout is the PR merge commit: first parent = base branch.
            files=$(git diff --name-only HEAD^1 HEAD) || all_true
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$AFTER") || all_true
          else
            all_true
          fi
          js=false; python=false; e2e=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*|LICENSE) continue ;;
            esac
            case "$f" in
              *.py|custom_components/*|tests/python/*|requirements-test.txt|pyproject.toml) python=true ;;
              .github/workflows/ci.yml) js=true; python=true; e2e=true ;;
              *) js=true ;;
            esac
            case "$f" in
              apps/*|packages/*|modules/*|tests/e2e/*|playwright.config.ts|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json|.nvmrc) e2e=true ;;
            esac
          done <<< "$files"
          printf 'js=%s\npython=%s\ne2e=%s\n' "$js" "$python" "$e2e" | tee -a "$GITHUB_OUTPUT"
      - name: Install Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $archive\$" checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: gitleaks git --config .gitleaks.toml --redact --log-opts="--all" .
