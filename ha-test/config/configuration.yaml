default_config:

template:
  - sensor:
      - name: Demo Waste Next
        unique_id: demo_waste_next
        device_class: date
        state: '{{ (now() + timedelta(days=2)).date().isoformat() }}'
        attributes:
          waste_type: Papír
      - name: Demo Energy Power
        unique_id: demo_energy_power
        device_class: power
        unit_of_measurement: W
        state: 420
      - name: Demo Temperature
        unique_id: demo_temperature
        device_class: temperature
        unit_of_measurement: °C
        state: 21
