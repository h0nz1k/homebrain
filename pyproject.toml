[project]
name = "homebrain"
version = "0.0.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "allow_blocking_calls: opt out of the event-loop blocking-call guard (conftest.py)",
]
