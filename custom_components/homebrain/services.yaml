# Descriptions of the services HomeBrain registers (HA loads this file for the UI and logs an
# error when it is missing). Keep in sync with hass.services.async_register calls.
wine_consume_text:
  name: Odepsat víno podle věty
  description: >-
    Odepíše láhev z vinotéky podle volné věty (hlasový asistent). Vrací stav, nejisté
    shody nechá na potvrzení.
  fields:
    text:
      name: Věta
      description: Co se vypilo, např. „vypili jsme ryzlink 2021“.
      required: true
      example: vypili jsme ryzlink 2021
      selector:
        text:
    source_operation_id:
      name: ID operace
      description: Volitelné ID pro idempotenci (opakované volání nic neodepíše dvakrát).
      required: false
      selector:
        text:
notify:
  name: Odeslat zprávu
  description: Doručí zprávu osobě nebo skupině podle preferencí, tichých hodin a priority.
  fields:
    recipient:
      name: Příjemce
      required: true
      example: household
      selector:
        text:
    message:
      name: Zpráva
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Nadpis
      selector:
        text:
    priority:
      name: Priorita
      default: normal
      selector:
        select:
          options: [info, normal, high, critical]
    channel:
      name: Vynucený kanál
      selector:
        select:
          options: [push, todo, tts, telegram, email]
    tag:
      name: Značka deduplikace
      selector:
        text:
    data:
      name: Data push oznámení
      selector:
        object:
